    <!-- LOGIC & MQTT REALTIME SYNC SCRIPT -->
    <script>
        const DEFAULT_PROMPTS = ["Coffee Mug", "Apple", "Car", "Clock", "Star", "Tree", "Phone", "Key", "Umbrella"];
        
        let currentRole = 'player';
        let currentRoom = 'QUARTS-1';
        let approvedScore = 0;
        let isDrawing = false;
        let timerInterval = null;
        let sprintEndTime = 0;
        let showAndTellEndTime = 0;
        let isSprintRunning = false;
        let isShowAndTellActive = false;
        let answersRevealed = false;
        let lastPos = null;

        // MQTT Setup
        let mqttClient = null;
        const mqttBrokerHost = "broker.emqx.io";
        const mqttBrokerPort = 8084; // WebSocket SSL port

        const canvas = document.getElementById('doodleCanvas');
        const ctx = canvas.getContext('2d');

        function drawGridLines() {
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 2;
            const cellW = canvas.width / 3;
            const cellH = canvas.height / 3;

            for (let i = 1; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(cellW * i, 0);
                ctx.lineTo(cellW * i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, cellH * i);
                ctx.lineTo(canvas.width, cellH * i);
                ctx.stroke();
            }
        }

        function drawStrokeOnCanvas(stroke) {
            ctx.strokeStyle = stroke.color || '#38bdf8';
            ctx.lineWidth = stroke.size || 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(stroke.x1, stroke.y1);
            ctx.lineTo(stroke.x2, stroke.y2);
            ctx.stroke();
        }

        function initMQTTConnection(roomCode) {
            // Safely disconnect previous client if active
            if (mqttClient && mqttClient.isConnected()) {
                try {
                    mqttClient.disconnect();
                } catch (e) {
                    console.log("Cleaned up old MQTT session.");
                }
            }

            const clientId = "quarts_" + currentRole + "_" + Math.random().toString(36).substring(2, 10);
            mqttClient = new Paho.MQTT.Client(mqttBrokerHost, mqttBrokerPort, clientId);

            mqttClient.onConnectionLost = onConnectionLost;
            mqttClient.onMessageArrived = onMessageArrived;

            mqttClient.connect({
                useSSL: true,
                timeout: 5,
                keepAliveInterval: 30,
                onSuccess: () => {
                    updateSyncBadge(true, `Connected Online (${roomCode})`);
                    const topic = `quarts/room/${roomCode}/#`;
                    mqttClient.subscribe(topic);

                    if (currentRole === 'gm') {
                        publishMQTT(`quarts/room/${roomCode}/prompts`, { prompts: DEFAULT_PROMPTS });
                    }
                },
                onFailure: (err) => {
                    console.warn("MQTT Connection failed:", err);
                    updateSyncBadge(false, "Connection failed - Retrying...");
                    setTimeout(() => initMQTTConnection(roomCode), 3000);
                }
            });
        }

        function updateSyncBadge(isConnected, text) {
            const dot = document.getElementById('syncDot');
            const statusText = document.getElementById('syncStatusText');
            if (statusText) statusText.innerText = text;

            if (dot) {
                if (isConnected) {
                    dot.className = "w-2 h-2 rounded-full bg-emerald-400";
                } else {
                    dot.className = "w-2 h-2 rounded-full bg-red-500 animate-ping";
                }
            }
        }

        function publishMQTT(topic, payload) {
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(JSON.stringify(payload));
                message.destinationName = topic;
                message.retained = true;
                mqttClient.send(message);
            }
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                updateSyncBadge(false, "Reconnecting...");
                setTimeout(() => initMQTTConnection(currentRoom), 2000);
            }
        }

        function onMessageArrived(message) {
            try {
                const topic = message.destinationName;
                const data = JSON.parse(message.payloadString);

                if (topic.endsWith('/stroke')) {
                    drawStrokeOnCanvas(data);
                } else if (topic.endsWith('/clear')) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawGridLines();
                } else if (topic.endsWith('/score')) {
                    approvedScore = data.score;
                    updateScoreDisplay();
                } else if (topic.endsWith('/timer')) {
                    if (data.action === 'start') {
                        sprintEndTime = data.sprintEndTime;
                        showAndTellEndTime = data.showAndTellEndTime;
                        isSprintRunning = true;
                        isShowAndTellActive = false;
                        startMasterTimerLoop();
                    } else if (data.action === 'reset') {
                        isSprintRunning = false;
                        isShowAndTellActive = false;
                        if (timerInterval) clearInterval(timerInterval);
                        document.getElementById('timerDisplay').innerText = "30.0s";
                        document.getElementById('timerLabel').innerHTML = `<i class="fa-solid fa-stopwatch mr-1 text-emerald-400"></i> Sprint Clock`;
                        document.getElementById('showAndTellBanner').classList.add('hidden');
                        document.getElementById('timesUpOverlay').classList.add('hidden');
                    }
                } else if (topic.endsWith('/prompts')) {
                    renderGMItems(data.prompts);
                } else if (topic.endsWith('/answersRevealed')) {
                    answersRevealed = data.revealed;
                    updateAnswersVisibility();
                }
            } catch (err) {
                console.error("MQTT Message parse error:", err);
            }
        }

        function selectRole(role) {
            currentRole = role;
            currentRoom = document.getElementById('roomCodeInput').value.trim().toUpperCase() || 'QUARTS-1';
            document.getElementById('roleModal').classList.add('hidden');

            const gmPanel = document.getElementById('gmCalloutPanel');
            const gmTally = document.getElementById('gmTallyControls');
            const brushTools = document.getElementById('brushTools');
            const timerGM = document.getElementById('timerControlsGM');
            const timerPlayer = document.getElementById('timerControlsPlayer');

            if (role === 'gm') {
                gmPanel.classList.remove('hidden');
                gmTally.classList.remove('hidden');
                brushTools.classList.add('hidden');
                timerGM.classList.remove('hidden');
                timerPlayer.classList.add('hidden');
                document.getElementById('canvasTitle').innerText = "Player Live Drawing Stream (View-Only Mode)";
                renderGMItems(DEFAULT_PROMPTS);
            } else {
                gmPanel.classList.add('hidden');
                gmTally.classList.add('hidden');
                brushTools.classList.remove('hidden');
                timerGM.classList.add('hidden');
                timerPlayer.classList.remove('hidden');
                document.getElementById('canvasTitle').innerText = "Doodle Canvas Grid (9 Perfect Squares)";
            }

            drawGridLines();
            initMQTTConnection(currentRoom);
        }

        function openRoleModal() {
            document.getElementById('roleModal').classList.remove('hidden');
        }

        function renderGMItems(items) {
            const container = document.getElementById('gmItemsList');
            if (container) {
                container.innerHTML = items.map((item, idx) => `
                    <div class="p-2 bg-github-bg border border-quartz-deep rounded-lg text-quartz-light font-bold">
                        <span class="text-[10px] text-github-muted block">#${idx + 1}</span>
                        ${item}
                    </div>
                `).join('');
            }

            const playerContainer = document.getElementById('playerAnswersList');
            if (playerContainer) {
                playerContainer.innerHTML = items.map((item, idx) => `
                    <div class="p-2 bg-github-bg border border-emerald-500/50 rounded-lg text-emerald-300 font-bold">
                        <span class="text-[10px] text-github-muted block">#${idx + 1}</span>
                        ${item}
                    </div>
                `).join('');
            }
        }

        function toggleRevealAnswers() {
            if (currentRole !== 'gm') return;
            answersRevealed = !answersRevealed;
            publishMQTT(`quarts/room/${currentRoom}/answersRevealed`, { revealed: answersRevealed });
        }

        function updateAnswersVisibility() {
            const btn = document.getElementById('btnRevealPlayer');
            const panel = document.getElementById('playerAnswersPanel');

            if (answersRevealed) {
                if (btn) btn.innerHTML = `<i class="fa-solid fa-eye-slash mr-1"></i> Hide Items from Player`;
                if (panel) panel.classList.remove('hidden');
            } else {
                if (btn) btn.innerHTML = `<i class="fa-solid fa-eye mr-1"></i> Reveal Items to Player`;
                if (panel) panel.classList.add('hidden');
            }
        }

        function triggerStartSprint() {
            if (currentRole !== 'gm') return;
            const now = Date.now();
            const sprintEnd = now + 30000;
            const showAndTellEnd = sprintEnd + 10000;

            publishMQTT(`quarts/room/${currentRoom}/timer`, {
                action: 'start',
                sprintEndTime: sprintEnd,
                showAndTellEndTime: showAndTellEnd
            });
        }

        function triggerResetSprint() {
            if (currentRole !== 'gm') return;
            publishMQTT(`quarts/room/${currentRoom}/timer`, { action: 'reset' });
        }

        function startMasterTimerLoop() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timesUpOverlay').classList.add('hidden');

            timerInterval = setInterval(() => {
                const now = Date.now();
                const sprintRemaining = Math.max(0, (sprintEndTime - now) / 1000);

                if (sprintRemaining > 0) {
                    isSprintRunning = true;
                    isShowAndTellActive = false;
                    document.getElementById('timerLabel').innerHTML = `<i class="fa-solid fa-stopwatch mr-1 text-emerald-400"></i> Sprint Clock`;
                    document.getElementById('timerDisplay').innerText = sprintRemaining.toFixed(1) + 's';
                    document.getElementById('showAndTellBanner').classList.add('hidden');
                    document.getElementById('timesUpOverlay').classList.add('hidden');
                } else {
                    isSprintRunning = false;
                    const showAndTellRemaining = Math.max(0, (showAndTellEndTime - now) / 1000);

                    if (showAndTellRemaining > 0) {
                        isShowAndTellActive = true;
                        document.getElementById('timerLabel').innerHTML = `<i class="fa-solid fa-bullhorn mr-1 text-amber-400"></i> Show & Tell`;
                        document.getElementById('timerDisplay').innerText = showAndTellRemaining.toFixed(1) + 's';
                        document.getElementById('showAndTellCountdown').innerText = showAndTellRemaining.toFixed(1) + 's';
                        document.getElementById('showAndTellBanner').classList.remove('hidden');
                        document.getElementById('timesUpOverlay').classList.add('hidden');
                    } else {
                        isShowAndTellActive = false;
                        clearInterval(timerInterval);
                        document.getElementById('timerDisplay').innerText = '0.0s';
                        document.getElementById('showAndTellBanner').classList.add('hidden');
                        document.getElementById('timesUpOverlay').classList.remove('hidden');
                    }
                }
            }, 100);
        }

        function startDraw(e) {
            if (currentRole === 'gm' || !isSprintRunning) return;
            isDrawing = true;
            lastPos = getPos(e);
        }

        function draw(e) {
            if (!isDrawing || currentRole === 'gm' || !isSprintRunning) return;
            const currentPos = getPos(e);
            const strokeData = {
                x1: lastPos.x,
                y1: lastPos.y,
                x2: currentPos.x,
                y2: currentPos.y,
                color: document.getElementById('brushColor').value,
                size: parseInt(document.getElementById('brushSize').value)
            };

            drawStrokeOnCanvas(strokeData);
            publishMQTT(`quarts/room/${currentRoom}/stroke`, strokeData);
            lastPos = currentPos;
        }

        function stopDraw() {
            isDrawing = false;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function triggerClearCanvas() {
            if (currentRole === 'gm') return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGridLines();
            publishMQTT(`quarts/room/${currentRoom}/clear`, { timestamp: Date.now() });
        }

        function adjustScore(delta) {
            if (currentRole !== 'gm') return;
            const newScore = Math.max(0, Math.min(9, approvedScore + delta));
            publishMQTT(`quarts/room/${currentRoom}/score`, { score: newScore });
        }

        function updateScoreDisplay() {
            document.getElementById('scoreDisplay').innerText = `${approvedScore} / 9`;

            const minBox = document.getElementById('rewardMin');
            const sweepBox = document.getElementById('rewardSweep');

            if (approvedScore >= 5) {
                minBox.className = "p-2 rounded border bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold flex items-center justify-between";
            } else {
                minBox.className = "p-2 rounded border bg-github-bg border-github-border text-github-muted flex items-center justify-between";
            }

            if (approvedScore === 9) {
                sweepBox.className = "p-2 rounded border bg-amber-950/60 border-amber-500 text-amber-200 font-bold flex items-center justify-between";
            } else {
                sweepBox.className = "p-2 rounded border bg-github-bg border-github-border text-github-muted flex items-center justify-between";
            }
        }

        function generateNewItems() {
            if (currentRole !== 'gm') return;
            const samplePool = ["Cat", "Sun", "House", "Car", "Tree", "Fish", "Book", "Glasses", "Guitar", "Hat", "Pizza", "Watch", "Moon", "Spoon", "Flower"];
            const shuffled = samplePool.sort(() => 0.5 - Math.random());
            const newItems = shuffled.slice(0, 9);
            publishMQTT(`quarts/room/${currentRoom}/prompts`, { prompts: newItems });
        }

        // LISTENERS
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDraw);

        window.addEventListener('load', () => {
            drawGridLines();
        });
    </script>
